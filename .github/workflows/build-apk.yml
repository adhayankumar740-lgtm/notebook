name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # Actions tab se manually "Run workflow" bhi kar sakte ho

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Project me gradlew / gradle-wrapper.jar nahi hai, isliye Gradle 9.3.1 yaha install hota hai
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Repo me maujood fixed debug.keystore use hota hai (make-keystore.yml ek baar bana deta hai)
      - name: Check keystore
        run: |
          if [ ! -f debug.keystore ]; then
            echo "debug.keystore repo me nahi mila. Pehle 'Make keystore (one time)' workflow chalao."
            exit 1
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Visor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
