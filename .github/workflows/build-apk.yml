name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # Actions tab se manually "Run workflow" bhi kar sakte ho

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Project me gradlew / gradle-wrapper.jar nahi hai, isliye Gradle 9.3.1 yaha install hota hai
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # app/build.gradle.kts debug.keystore maangta hai (.gitignore me hai), isliye CI me bana lete hain
      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Visor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
