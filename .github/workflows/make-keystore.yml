name: Make keystore (one time)
on:
  workflow_dispatch:
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          base64 -w0 debug.keystore > keystore-base64.txt
          echo "----- COPY FROM NEXT LINE -----"
          cat keystore-base64.txt
          echo ""
          echo "----- COPY TILL PREVIOUS LINE -----"
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat keystore-base64.txt >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Save as downloadable file
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: keystore-base64.txt
          
