name: Make keystore (one time)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/make-keystore.yml'

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate keystore and save it in the repo
        run: |
          if [ -f debug.keystore ]; then
            echo "debug.keystore already exists in repo - nothing to do"
            exit 0
          fi
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f debug.keystore
          git commit -m "Add fixed debug keystore"
          git push
